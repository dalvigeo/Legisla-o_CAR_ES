name: Atualizar textos das normas

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data.js'
      - 'data-current.js'
      - 'source_overrides.json'
      - 'secondary_sources.json'
      - 'manual_texts/**'
      - 'scripts/build_legislation.py'
      - 'scripts/enrich_generated.py'
      - 'scripts/process_secondary_sources.py'
      - 'scripts/apply_manual_texts.py'
      - 'scripts/quality_audit.py'
      - '.github/workflows/atualizar-textos.yml'
  schedule:
    - cron: '20 9 1 * *'

permissions:
  contents: write

concurrency:
  group: atualizar-textos-main
  cancel-in-progress: true

jobs:
  atualizar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependências
        run: pip install requests beautifulsoup4 lxml pymupdf

      - name: Gerar textos-base em atualização completa
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: python scripts/build_legislation.py

      - name: Reutilizar textos-base em atualização incremental
        if: ${{ github.event_name == 'push' }}
        run: echo "Atualização incremental - usando textos-base já existentes."

      - name: Consolidar e completar fontes
        run: python scripts/enrich_generated.py

      - name: Processar fontes textuais alternativas
        run: python scripts/process_secondary_sources.py

      - name: Aplicar transcrições validadas
        run: python scripts/apply_manual_texts.py

      - name: Auditar qualidade textual
        run: python scripts/quality_audit.py

      - name: Publicar conteúdo gerado no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add textos generated-index.js generated-sources.js generated-report.json
          if git diff --cached --quiet; then
            echo "Nenhuma alteração nos textos."
          else
            git commit -m "Atualiza textos normativos a partir das fontes"
            git pull --rebase origin main
            git push origin main
          fi
